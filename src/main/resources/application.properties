# Konsolda vaqt va log darajasini ko'rsatish
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Ilova web-server emas (faqat long-polling), shuning uchun web portini o'chirib qo'yamiz
spring.main.web-application-type=none



